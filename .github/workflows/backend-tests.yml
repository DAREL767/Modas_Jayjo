name: Backend tests

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - feature/CR-014-user-crud-hardening

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.12 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      MONGODB_URI: ${{ secrets.MONGODB_TEST_URI }}
      MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}
      MONGODB_TEST_DATABASE: ${{ secrets.MONGODB_TEST_DATABASE }}
      DATABASE_NAME: modas_jayjo_ci_guard
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
